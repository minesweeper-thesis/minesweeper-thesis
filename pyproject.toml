[project]
name = "minesweeper-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "joblib>=1.5.1",
    "lightgbm>=4.6.0",
    "numpy>=2.3.2",
    "onnxruntime>=1.23.2",
    "ortools>=9.14.6206",
    "scikit-learn==1.7.0",
    "scikit-opt>=0.6.6",
    "scikit-optimize>=0.10.2",
    "torch>=2.8.0",
    "xgboost>=3.0.4",
]
[tool.mypy]
python_version = "3.12"
files = ["backend/"]

[[tool.mypy.overrides]]
module = ["algorithms.*", "filetype.*", "apscheduler.*"]
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true
